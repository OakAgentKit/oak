version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /examples
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
