name: Documentation links
on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2 # v2.6.1
        with:
          lycheeVersion: v0.20.1
          # npm package pages block CI clients with 403; keep other npmjs pages checked.
          # VS Code MCP install redirects to the vscode: handler by design.
          args: --no-progress --max-retries 2 --timeout 20 --exclude '^https?://(www\.)?(x|twitter)\.com([/?#]|$)' --exclude '^https?://(www\.)?npmjs\.com/package/(@[^/?#]+/)?[^@/?#][^/?#]*/?([?#].*)?$' --exclude '^https://vscode\.dev/redirect\?url=vscode%3Amcp%2Finstall%3F' README.md 'docs/**/*.md'
          fail: true
          token: ''
