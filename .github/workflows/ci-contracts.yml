name: Contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Locate contract project (missing source fails)
        id: contracts
        run: bash .github/scripts/contracts-path.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1
      - name: Provision declared npm contract dependencies
        working-directory: ${{ steps.contracts.outputs.directory }}
        run: |
          if [[ -f package.json ]]; then
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          fi
      - name: Provision checksum-pinned Solidity compiler
        run: bash .github/scripts/setup-solc.sh
      - name: Offline build
        working-directory: ${{ steps.contracts.outputs.directory }}
        run: forge build --offline --use "$OAK_CI_SOLC"
      - name: Offline tests
        working-directory: ${{ steps.contracts.outputs.directory }}
        run: forge test --offline --use "$OAK_CI_SOLC"
