name: Examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Check exact npm package versions (prelaunch gate)
        id: packages
        env:
          OAK_EXAMPLES_REQUIRE_PUBLISHED: ${{ vars.OAK_EXAMPLES_REQUIRE_PUBLISHED }}
        run: node .github/scripts/check-packages.mjs
      - name: Install examples without lifecycle scripts
        if: steps.packages.outputs.ready == 'true'
        working-directory: examples
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Offline example tests
        if: steps.packages.outputs.ready == 'true'
        working-directory: examples
        run: npm test
