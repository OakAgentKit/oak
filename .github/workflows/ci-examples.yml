name: Examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check exact npm package versions (prelaunch gate)
        id: packages
        env:
          OAK_EXAMPLES_REQUIRE_PUBLISHED: ${{ vars.OAK_EXAMPLES_REQUIRE_PUBLISHED }}
        run: node .github/scripts/check-packages.mjs
      - name: Install examples without lifecycle scripts
        if: steps.packages.outputs.ready == 'true'
        working-directory: examples
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Offline example tests
        if: steps.packages.outputs.ready == 'true'
        working-directory: examples
        run: npm test
