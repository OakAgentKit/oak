    <text x="278" y="29" font-size="12" font-style="italic" fill="#3E695B">Transaction signing stays local; transaction paths are simulated before signing</text>
    <rect x="886" y="13" width="290" height="24" rx="6" fill="#E7EFE0" stroke="#B5C9AE"/>
    <rect x="898" y="21" width="8" height="8" rx="2" fill="#062F27"/>
    <text x="914" y="29" font-size="10.5" font-weight="700" fill="#123D32">PRIVATE KEY NEVER LEAVES YOUR MACHINE</text>

    <rect x="24" y="64" width="904" height="254" rx="8" fill="#E7EFE0" stroke="#B5C9AE"/>
    <text x="40" y="84" font-size="10.5" font-weight="700" fill="#E2AA5B">ON YOUR MACHINE · LOCAL WALLET, CHECKS &amp; SIGNING BOUNDARY</text>
    <text x="912" y="84" text-anchor="end" font-size="10.5" fill="#3E695B">oak mcp · @oakagentkit/addon</text>
    <rect x="956" y="64" width="220" height="254" rx="8" fill="#E7EFE0" stroke="#B5C9AE"/>
    <text x="972" y="84" font-size="10.5" font-weight="700" fill="#E2AA5B">ROBINHOOD CHAIN · 4663</text>

    <g id="step-1">
      <rect x="38" y="108" width="182" height="196" rx="8" fill="#FAFDF7" stroke="#B5C9AE"/>
      <rect x="44" y="108.5" width="170" height="3" rx="1.5" fill="#E2AA5B"/>
      <text x="54" y="132" font-size="10.5" font-weight="700" fill="#E2AA5B">STEP 01 · MCP CLIENT</text>
      <text x="54" y="160" font-size="18" font-weight="700" fill="#123D32">Your agent</text>
      <text x="54" y="188" font-size="12.5" fill="#3E695B">Claude Code, Cursor,</text>
      <text x="54" y="205" font-size="12.5" fill="#3E695B">Codex, Gemini, or any MCP</text>
      <text x="54" y="222" font-size="12.5" fill="#3E695B">client calls an Oak tool.</text>
      <rect x="54" y="264" width="150" height="24" rx="6" fill="#E7EFE0" stroke="#B5C9AE"/>
      <text x="129" y="280" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#123D32">Plain MCP tool call</text>
    </g>

    <g id="step-2" aria-label="oak mcp · @oakagentkit/addon">
      <rect x="248" y="108" width="238" height="196" rx="8" fill="#FAFDF7" stroke="#E2AA5B"/>
      <rect x="254" y="108.5" width="226" height="3" rx="1.5" fill="#E2AA5B"/>
      <text x="264" y="132" font-size="10.5" font-weight="700" fill="#E2AA5B">STEP 02 · LOCAL MCP ADD-ON</text>
      <text x="264" y="158" font-size="17" font-weight="700" fill="#123D32">Oak: local wallet,</text>
      <text x="264" y="178" font-size="17" font-weight="700" fill="#123D32">checks &amp; signing</text>
      <text x="264" y="208" font-size="12" fill="#3E695B">Transactions: estimate transfers via</text>
      <text x="264" y="224" font-size="12" fill="#3E695B">eth_simulateV1. Gas and external</text>
      <text x="264" y="240" font-size="12" fill="#3E695B">settlement stay outside the preview.</text>
      <rect x="264" y="264" width="206" height="24" rx="6" fill="#E7EFE0" stroke="#B5C9AE"/>
      <text x="367" y="280" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#123D32">Local transaction checks</text>
    </g>

    <g id="step-3">
      <rect x="514" y="108" width="178" height="196" rx="8" fill="#FAFDF7" stroke="#B5C9AE"/>
      <rect x="520" y="108.5" width="166" height="3" rx="1.5" fill="#E2AA5B"/>
      <text x="530" y="132" font-size="10.5" font-weight="700" fill="#E2AA5B">STEP 03 · CONFIRMATION</text>
      <text x="530" y="160" font-size="17" font-weight="700" fill="#123D32">ask: you approve</text>
      <text x="530" y="190" font-size="11.5" fill="#3E695B">Review estimates and finite</text>
      <text x="530" y="206" font-size="11.5" fill="#3E695B">approval caps. Owner-set auto</text>
      <text x="530" y="222" font-size="11.5" fill="#3E695B">skips prompts, not checks.</text>
      <text x="530" y="238" font-size="11.5" fill="#3E695B">Typed data binds EIP-712.</text>
      <rect x="530" y="264" width="146" height="24" rx="6" fill="#E7EFE0" stroke="#B5C9AE"/>
      <text x="603" y="280" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#123D32">Ask or owner auto</text>
    </g>

    <g id="step-4">
      <rect x="720" y="108" width="194" height="196" rx="8" fill="#EDF4E6" stroke="#062F27"/>
      <rect x="726" y="108.5" width="182" height="3" rx="1.5" fill="#062F27"/>
      <text x="736" y="132" font-size="10.5" font-weight="700" fill="#123D32">STEP 04 · LOCAL CUSTODY</text>
      <text x="736" y="158" font-size="17" font-weight="700" fill="#123D32">signed on your</text>
      <text x="736" y="178" font-size="17" font-weight="700" fill="#123D32">machine</text>
      <text x="736" y="208" font-size="12" fill="#3E695B">Your wallet key signs inside</text>
      <text x="736" y="224" font-size="12" fill="#3E695B">@oakagentkit/addon.</text>
      <text x="736" y="240" font-size="12" fill="#3E695B">The key is never sent to Oak.</text>
      <rect x="736" y="264" width="162" height="24" rx="6" fill="#062F27"/>
      <text x="817" y="280" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#F2F6EC">Local key signature</text>
    </g>

    <g id="step-5">
      <rect x="968" y="108" width="194" height="196" rx="8" fill="#FAFDF7" stroke="#B5C9AE"/>
      <rect x="974" y="108.5" width="182" height="3" rx="1.5" fill="#E2AA5B"/>
      <text x="984" y="132" font-size="10.5" font-weight="700" fill="#E2AA5B">STEP 05 · DIRECT SETTLEMENT</text>
      <text x="984" y="158" font-size="17" font-weight="700" fill="#123D32">25 configured</text>
      <text x="984" y="178" font-size="17" font-weight="700" fill="#123D32">chain projects</text>
      <text x="984" y="208" font-size="12" fill="#3E695B">Configured swaps, vaults,</text>
      <text x="984" y="224" font-size="12" fill="#3E695B">lending, bridges and identity</text>
      <text x="984" y="240" font-size="12" fill="#3E695B">settle from your wallet.</text>
      <rect x="984" y="264" width="162" height="24" rx="6" fill="#E7EFE0" stroke="#B5C9AE"/>
      <text x="1065" y="280" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#123D32">Direct on-chain tx</text>
    </g>

    <g fill="none" stroke="#E2AA5B" stroke-width="1.5"><path d="M224 206h19"/><path d="m238 201 5 5-5 5"/><path d="M490 206h19"/><path d="m504 201 5 5-5 5"/><path d="M696 206h19"/><path d="m710 201 5 5-5 5"/></g>
    <g fill="none" stroke="#062F27" stroke-width="1.5"><path d="M918 206h43"/><path d="m956 201 5 5-5 5"/></g>

    <rect x="24" y="352" width="206" height="84" rx="8" fill="#E7EFE0" stroke="#B5C9AE"/>
    <text x="40" y="374" font-size="10.5" font-weight="700" fill="#E2AA5B">CHANNEL KEY</text>
    <path d="M40 394h32m-5-5 5 5-5 5" fill="none" stroke="#E2AA5B" stroke-width="1.5"/><text x="82" y="398" font-size="11.5" fill="#123D32">Local signing &amp; tx flow</text>
    <path d="M40 418h32" fill="none" stroke="#3E695B" stroke-width="1.5" stroke-dasharray="4 3"/><text x="82" y="422" font-size="11.5" fill="#123D32">Quote and routing state</text>

    <rect x="248" y="352" width="466" height="84" rx="8" fill="#FAFDF7" stroke="#B5C9AE"/>
    <rect x="248.5" y="358" width="3" height="72" rx="1.5" fill="#E2AA5B"/>
    <text x="268" y="375" font-size="10.5" font-weight="700" fill="#E2AA5B">HOSTED SERVICE · READS, QUOTES &amp; UNSIGNED ROUTING</text>
    <text x="268" y="401" font-size="18" font-weight="700" fill="#123D32">Oak service: prices, stateful quotes, routing</text>
    <text x="268" y="421" font-size="11.5" fill="#3E695B">Supplies public data and unsigned calldata; never receives your wallet key.</text>

    <rect x="732" y="352" width="444" height="84" rx="8" fill="#E7EFE0" stroke="#B5C9AE"/>
    <rect x="732.5" y="358" width="3" height="72" rx="1.5" fill="#062F27"/>
    <text x="752" y="375" font-size="10.5" font-weight="700" fill="#123D32">CUSTODY &amp; APPROVAL BOUNDARY</text>
    <text x="752" y="401" font-size="17" font-weight="700" fill="#123D32">Direct wallet-to-protocol execution on Chain ID 4663</text>
    <text x="752" y="421" font-size="11.5" fill="#3E695B">Finite approvals only (never unlimited); no zero-residual guarantee.</text>
