<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Oak signing and custody flow: transaction previews estimate transfers; ask mode prompts before local signing while owner-configured auto skips the prompt; typed-data paths bind EIP-712 payloads; 25 configured projects; hosted stateful quotes and unsigned routing">
  <rect x="0.5" y="0.5" width="1199" height="459" rx="8" fill="#F2F6EC" stroke="#B5C9AE"/>
  <g font-family="Arial, sans-serif">
