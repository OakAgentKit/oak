[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "test" }]

[profile.default.fuzz]
runs = 256

# Run the TickMath differential property with an explicit 100,000 random cases.
[profile.tickmath.fuzz]
runs = 100000
