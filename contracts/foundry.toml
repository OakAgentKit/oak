[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "test" }]

# Deployment fixtures use vm.setEnv, which is shared across test suites.
# Serialize those suites so plain forge test --offline is reproducible.
threads = 1
